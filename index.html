<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ไฟเขียว · แผนที่ไฟจราจรและน้ำท่วม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map"></div>

<!-- top: search / directions -->
<div id="top">
  <div class="searchbar" id="searchbar">
    <div class="logo" title="ไฟเขียว"><span class="ms fill">traffic</span></div>
    <input id="q" placeholder="ค้นหาที่นี่" autocomplete="off">
    <button class="icon-btn" id="qClear" hidden><span class="ms">close</span></button>
    <button class="icon-btn accent" id="dirBtnTop" title="เส้นทาง"><span class="ms fill">directions</span></button>
  </div>
  <div class="dirbar" id="dirbar" hidden>
    <button class="icon-btn" id="dirBack"><span class="ms">arrow_back</span></button>
    <div class="dir-fields">
      <div class="dir-field"><span class="dot-from"></span><input id="from" placeholder="ตำแหน่งของคุณ" autocomplete="off"></div>
      <div class="dir-field"><span class="ms pin-to fill">location_on</span><input id="to" placeholder="เลือกปลายทาง" autocomplete="off"></div>
    </div>
    <button class="icon-btn" id="dirSwap" title="สลับ"><span class="ms">swap_vert</span></button>
  </div>
  <div class="suggest" id="suggest" hidden></div>
  <div class="chips" id="chips">
    <button class="chip on" data-layer="traffic"><span class="ms">traffic_jam</span>การจราจร</button>
    <button class="chip on" data-layer="lights"><span class="ms">traffic</span>ไฟจราจร</button>
    <button class="chip on" data-layer="floods"><span class="ms">water_drop</span>น้ำท่วม</button>
    <button class="chip action" id="chipReport"><span class="ms">add_location_alt</span>แจ้งน้ำท่วม</button>
    <button class="chip action" id="chipDrive"><span class="ms">directions_car</span>ช่วยวัดไฟ</button>
  </div>
</div>

<div class="hint" id="hint" hidden></div>
<div class="center-pin" id="centerPin" hidden><span class="ms fill">location_on</span><i></i></div>

<!-- right side -->
<div class="fabs" id="fabs">
  <button class="fab" id="locate" title="ตำแหน่งของฉัน"><span class="ms">my_location</span></button>
</div>

<!-- bottom sheet (left panel on desktop) -->
<div class="sheet" id="sheet" data-size="hidden">
  <div class="handle" id="handle"><i></i></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
